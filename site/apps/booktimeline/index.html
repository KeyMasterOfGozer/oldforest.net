<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Timeline — Old Forest</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/vis-timeline/7.7.3/vis-timeline-graph2d.min.css">
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/vis-timeline/7.7.3/vis-timeline-graph2d.min.js">
  </script>

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #0d1a0b;
      --surface: #162414;
      --border:  #2a3e20;
      --text:    #e8d8b0;
      --muted:   #859e6a;
      --accent:  #78a84e;
      --radius:  8px;
    }

    body { background: var(--bg); color: var(--text);
           font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; min-height: 100vh; }

    /* ── Header ── */
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 0 24px; position: sticky; top: 0; z-index: 100; }
    .header-inner { display: flex; align-items: center; height: 56px; }
    .site-title { font-size: 20px; font-weight: 700; color: var(--accent); letter-spacing: -.3px; font-family: Georgia, serif; white-space: nowrap; text-decoration: none; margin-right: 20px; }
    .header-nav { display: flex; align-items: center; gap: 14px; flex: 1; }
    .header-auth { display: flex; align-items: center; gap: 10px; font-family: -apple-system, sans-serif; white-space: nowrap; }
    #user-email, #user-name { color: var(--muted); font-size: 13px; }
    .nav-link { font-family: -apple-system, sans-serif; font-size: 13px; color: var(--muted); text-decoration: none; transition: color .15s; }
    .nav-link:hover { color: var(--accent); }
    .rss-link { display: inline-flex; align-items: center; gap: 5px; font-family: -apple-system, sans-serif; font-size: 12px; font-weight: 600; color: #fff; background: #f26522; border-radius: 4px; padding: 3px 7px; text-decoration: none; transition: opacity .15s; white-space: nowrap; }
    .rss-link:hover { opacity: .85; color: #fff; text-decoration: none; }

    /* ── Section tabs ── */
    .section-tabs { display: flex; gap: 0; border-bottom: 1px solid var(--border); margin-bottom: 24px; }
    .section-tab { padding: 8px 20px; font-size: 14px; font-weight: 500; color: var(--muted); border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s, border-color .15s; text-decoration: none; font-family: -apple-system, sans-serif; }
    .section-tab:hover { color: var(--text); text-decoration: none; }
    .section-tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* ── Main ── */
    main { max-width: 1200px; margin: 0 auto; padding: 28px 24px 40px; }

    h1 { font-size: 26px; color: var(--accent); margin-bottom: 6px; font-family: Georgia, serif; }
    .subtitle { color: var(--muted); font-size: 14px; margin-bottom: 24px; }

    /* ── Controls ── */
    .controls { display: flex; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
    .controls label { font-size: 13px; color: var(--muted); }
    .controls select, .controls input[type="checkbox"] { accent-color: var(--accent); }
    select {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--text); font-size: 13px; padding: 5px 10px; outline: none;
    }
    select:focus { border-color: var(--accent); }

    /* ── Timeline container ── */
    #timeline-wrap {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      min-height: 300px;
      background: var(--surface);
    }
    /* Cap vis-timeline's auto-calculated height so it never overflows
       #timeline-wrap's 298px content area (300px box - 2px border). */
    #timeline { max-height: 295px; overflow: hidden; }

    /* Waterfall: hide the empty left group-label panel */
    .vis-panel.vis-left { width: 0 !important; min-width: 0 !important;
                          border: none !important; padding: 0 !important; }
    .vis-labelset { display: none !important; }

    /* Compact row height — text overflows past right edge of bar */
    .vis-item,
    .vis-item-overflow { overflow: visible !important; }
    .vis-item { height: 20px !important; font-size: 11px !important; }
    .vis-item .vis-item-content {
      position: absolute !important;
      left: 3px !important;              /* pin to left edge of bar */
      top: 50% !important;
      transform: translateY(-50%) !important;
      white-space: nowrap !important;
      overflow: hidden !important;       /* clip at max-width set per-item by JS */
      text-overflow: ellipsis !important;
      pointer-events: none !important;   /* overflow text doesn't block mouse on adjacent bars */
      line-height: 1 !important;
      padding: 0 !important;
    }

    /* ── Sticky item popup ── */
    #item-popup {
      display: none;
      position: fixed;
      z-index: 500;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 14px;
      border-radius: var(--radius);
      font-size: 13px;
      width: 300px;
      line-height: 1.5;
      font-family: -apple-system, sans-serif;
      box-shadow: 0 4px 20px rgba(0,0,0,.5);
      pointer-events: auto;
    }
    /* Cover + info row */
    .ip-head { display: flex; gap: 10px; margin-bottom: 8px; }
    .ip-cover { width: 52px; height: 76px; object-fit: cover; border-radius: 3px; flex-shrink: 0; background: var(--border); }
    .ip-cover-ph { width: 52px; height: 76px; background: var(--border); border-radius: 3px;
                   display: flex; align-items: center; justify-content: center; font-size: 26px; flex-shrink: 0; }
    .ip-info { min-width: 0; flex: 1; }
    .ip-title  { font-weight: 700; font-size: 13px; color: var(--text); line-height: 1.3; margin-bottom: 2px; }
    .ip-series { font-size: 11px; color: var(--accent); font-style: italic; margin-bottom: 3px; }
    .ip-author { font-size: 12px; color: var(--muted); margin-bottom: 3px; }
    .ip-stars  { color: #c8a040; font-size: 11px; letter-spacing: 1px; }
    .ip-meta   { font-size: 11px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
    /* Description */
    .ip-desc { font-size: 11px; color: var(--muted); line-height: 1.5; margin-bottom: 8px;
               display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    /* Link buttons — same palette as homepage card */
    .ip-links { display: flex; flex-wrap: wrap; gap: 4px; }
    .ip-link { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 4px;
               text-decoration: none !important; transition: opacity .15s; }
    .ip-link:hover { opacity: .8; }
    .ip-link-ol     { background: #1a3460; color: #aaccff; border: 1px solid #5588cc; }
    .ip-link-gb     { background: #1a3828; color: #88ddaa; border: 1px solid #44aa66; }
    .ip-link-amz    { background: #ff9900; color: #111; }
    .ip-link-rr     { background: #3a1060; color: #d0aaff; border: 1px solid #8855cc; }
    .ip-link-gr     { background: #553b08; color: #e8d8b0; border: 1px solid #8b6914; }
    .ip-link-search { background: #1d2e1a; color: var(--muted); border: 1px solid var(--border); }

    #loading { padding: 80px; text-align: center; color: var(--muted); font-size: 15px; }
    #error   { padding: 60px; text-align: center; color: #c05848; font-size: 15px; }

    /* ── Overview / scrubber (canvas) ── */
    #overview-section { display: none; margin-top: 6px; }
    .overview-label {
      font-size: 11px; color: var(--muted); text-transform: uppercase;
      letter-spacing: .06em; margin-bottom: 4px;
      font-family: -apple-system, sans-serif;
    }
    #overview-canvas {
      display: block;
      width: 100%;
      height: 56px;    /* WATERFALL_ROWS(12) × ~3.7px + 12px for year labels */
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: crosshair;
      user-select: none;
    }

    /* ── Legend ── */
    .legend { display: flex; gap: 20px; margin-top: 16px; flex-wrap: wrap; font-size: 13px; }
    .legend-item { display: flex; align-items: center; gap: 7px; }
    .legend-dot { width: 14px; height: 14px; border-radius: 3px; flex-shrink: 0; }
    .dot-owned    { background: #5588cc; }
    .dot-kindle   { background: #555; }
    .dot-borrowed { background: #44aa66; }
    .dot-current  { background: #cc4444; }

    /* ── vis-timeline dark theme overrides ── */
    .vis-timeline { background: var(--surface) !important; border: none !important; }
    .vis-panel.vis-center, .vis-panel.vis-left, .vis-panel.vis-right,
    .vis-panel.vis-top, .vis-panel.vis-bottom { border-color: var(--border) !important; }
    .vis-time-axis .vis-text { color: var(--muted) !important; }
    .vis-time-axis .vis-grid.vis-minor { border-color: #1e3018 !important; }
    .vis-time-axis .vis-grid.vis-major { border-color: #2a3e20 !important; }
    .vis-current-time { background: var(--accent) !important; }

    /* Book item styles */
    .vis-item { border-radius: 4px !important; border-width: 1px !important; font-size: 12px !important; }
    .vis-item.owned    { background: #1a3460 !important; border-color: #5588cc !important; color: #aaccff !important; }
    .vis-item.kindle   { background: #555555 !important; border-color: #aaaaaa !important; color: #eeeeee !important; }
    .vis-item.borrowed { background: #1a3828 !important; border-color: #44aa66 !important; color: #88ddaa !important; }
    .vis-item.current  { background: #3a1818 !important; border-color: #cc4444 !important; color: #ffaaaa !important; }

    .vis-item.vis-selected.owned    { background: #2a4a80 !important; }
    .vis-item.vis-selected.kindle   { background: #6a6a6a !important; }
    .vis-item.vis-selected.borrowed { background: #1e4830 !important; }
    .vis-item.vis-selected.current  { background: #4a2020 !important; }

    /* vis-timeline built-in tooltip — suppressed; we use #item-popup instead */
    .vis-tooltip { display: none !important; }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <a class="site-title" href="/">🌳 Old Forest</a>
    <nav class="header-nav">
      <a href="/v1/feed.xml" class="rss-link" title="RSS Feed"><svg width="11" height="11" viewBox="0 0 8 8" fill="currentColor" aria-hidden="true"><circle cx="1" cy="7" r="1"/><path d="M0 4q4 0 4 4h1.5Q5.5 2.5 0 2.5z"/><path d="M0 1Q7 1 7 8h1.5Q8.5-.5 0-.5z"/></svg> RSS</a>
      <a href="/" class="nav-link">Blog</a>
      <a href="/books/" class="nav-link">Books</a>
      <a href="/apps.html" class="nav-link">Apps</a>
    </nav>
  </div>
</header>

<main>
  <div class="section-tabs">
    <a href="/books/" class="section-tab">Books</a>
    <a href="/apps/booktimeline/" class="section-tab active">Timeline</a>
    <a href="/apps/bookcsvgen/" class="section-tab">Stats &amp; CSV</a>
  </div>

  <h1>📚 Book Timeline</h1>
  <p class="subtitle">Books read over the years. Drag to scroll, scroll to zoom.</p>

  <div class="controls">
    <label>
      Show:&nbsp;
      <select id="filter-tag">
        <option value="all">All books</option>
        <option value="owned">Owned (blue)</option>
        <option value="kindle">Kindle (grey)</option>
        <option value="borrowed">Borrowed (green)</option>
        <option value="current">Currently reading (red)</option>
      </select>
    </label>
  </div>

  <div id="timeline-wrap">
    <div id="loading">Loading reading history…</div>
    <div id="timeline" style="display:none"></div>
  </div>
  <div id="item-popup"></div>
  <div id="overview-section">
    <div class="overview-label">All time — click or drag to navigate</div>
    <canvas id="overview-canvas" height="56"></canvas>
  </div>

  <div class="legend">
    <span class="legend-item"><span class="legend-dot dot-owned"></span> Owned library</span>
    <span class="legend-item"><span class="legend-dot dot-kindle"></span> Kindle</span>
    <span class="legend-item"><span class="legend-dot dot-borrowed"></span> Borrowed</span>
    <span class="legend-item"><span class="legend-dot dot-current"></span> Currently reading</span>
  </div>
</main>

<script src="/js/util.js"></script>
<script>
'use strict';

const API_BASE       = 'https://aijo86kijl.execute-api.us-east-1.amazonaws.com';
const WATERFALL_ROWS = 12;   // fixed lane count — change to taste
const API      = '/v1/reading/reads';

let allItems      = [];
let dataset       = null;
let groupsDataset = null;
let mainTimeline  = null;
let scrubMin     = 0;   // ms — full time range of all items
let scrubMax     = 0;

// ── Helpers ───────────────────────────────────────────────────────────────────

function isoToDate(iso) {
  // Accepts YYYY-MM-DD or full ISO string
  return iso ? new Date(iso.length === 10 ? iso + 'T12:00:00Z' : iso) : null;
}

function readClass(read) {
  if (!read.book) return 'owned';
  const tags   = (read.book.tags ?? []).map(s => String(s).toLowerCase());
  const format = (read.format ?? '').toLowerCase();
  if (format === 'kindle')          return 'kindle';
  if (format === 'audiobook')       return 'kindle';   // same neutral style
  if (tags.includes('borrowed'))    return 'borrowed';
  if (tags.includes('kindle'))      return 'kindle';
  return 'owned';
}

// esc() and seriesLabel() provided by /js/util.js

function stars(rating) {
  if (!rating || rating <= 0) return '';
  return '★'.repeat(Math.round(rating)) + '☆'.repeat(5 - Math.round(rating));
}

function buildPopupHTML(read, book) {
  // Cover
  const coverHtml = book.coverUrl
    ? `<img class="ip-cover" src="${esc(book.coverUrl)}" alt="" loading="lazy">`
    : `<div class="ip-cover-ph">📚</div>`;

  // Stars + meta
  const starsHtml = read.rating
    ? `<div class="ip-stars">${stars(read.rating)}</div>` : '';
  const metaParts = [];
  if (read.format) metaParts.push(read.format.charAt(0).toUpperCase() + read.format.slice(1));
  if (read.started)  metaParts.push(read.started);
  if (read.finished) metaParts.push(`→ ${read.finished}`);
  else               metaParts.push('→ currently reading');
  const metaHtml = `<div class="ip-meta">${metaParts.join(' · ')}</div>`;

  // Description
  const descHtml = book.description
    ? `<div class="ip-desc">${esc(book.description.substring(0, 200))}</div>` : '';

  // Links — exact first, search fallbacks last
  const exactLinks = [];
  const olId = book.openLibraryId || (book.googleBooksId?.startsWith('OL') ? book.googleBooksId : null);
  if (olId) {
    exactLinks.push(`<a class="ip-link ip-link-ol" href="https://openlibrary.org/works/${encodeURIComponent(olId)}" target="_blank">Open Library</a>`);
  }
  if (book.googleBooksId && !book.googleBooksId.startsWith('OL')) {
    exactLinks.push(`<a class="ip-link ip-link-gb" href="https://books.google.com/books?id=${encodeURIComponent(book.googleBooksId)}" target="_blank">Google Books</a>`);
  }
  if (book.amazonId) {
    exactLinks.push(`<a class="ip-link ip-link-amz" href="https://www.amazon.com/dp/${encodeURIComponent(book.amazonId)}" target="_blank">Amazon</a>`);
  }
  if (book.royalRoadId) {
    exactLinks.push(`<a class="ip-link ip-link-rr" href="https://www.royalroad.com/fiction/${encodeURIComponent(book.royalRoadId)}" target="_blank">Royal Road</a>`);
  }
  if (book.goodreadsUrl) {
    exactLinks.push(`<a class="ip-link ip-link-gr" href="${esc(book.goodreadsUrl)}" target="_blank">Goodreads</a>`);
  }

  const searchLinks = [];
  if (!olId && !book.googleBooksId) {
    const q = encodeURIComponent((book.title || '') + ' ' + (book.author || ''));
    searchLinks.push(`<a class="ip-link ip-link-search" href="https://books.google.com/books?q=${q}" target="_blank">🔍 Google Books</a>`);
  }
  if (!book.goodreadsUrl) {
    const q = encodeURIComponent(book.isbn || ((book.title || '') + ' ' + (book.author || '')));
    searchLinks.push(`<a class="ip-link ip-link-search" href="https://www.goodreads.com/search?q=${q}" target="_blank">🔍 Goodreads</a>`);
  }

  const allLinks = [...exactLinks, ...searchLinks];
  const linksHtml = allLinks.length ? `<div class="ip-links">${allLinks.join('')}</div>` : '';

  return `
    <div class="ip-head">
      ${coverHtml}
      <div class="ip-info">
        <div class="ip-title">${esc(book.title || 'Unknown')}</div>
        ${seriesLabel(book) ? `<div class="ip-series">${esc(seriesLabel(book))}</div>` : ''}
        <div class="ip-author">${esc(book.author || '')}</div>
        ${starsHtml}
        ${metaHtml}
      </div>
    </div>
    ${descHtml}
    ${linksHtml}`;
}

function buildItems(reads) {
  const items = [];
  let id = 0;
  const now = new Date();
  for (const read of reads) {
    const start = isoToDate(read.started);
    const end   = isoToDate(read.finished);
    if (!start && !end) continue;
    const effectiveStart = start ?? end;
    const isCurrent      = !end;
    const book           = read.book ?? {};
    const cls            = isCurrent ? 'current' : readClass(read);
    items.push({
      id:        id++,
      content:   book.title || 'Unknown',
      start:     effectiveStart,
      end:       end ?? now,
      // No 'title' → vis-timeline won't show its own moving tooltip.
      // _read stores the full data; popup is built on demand in showPopup().
      _read:     read,
      className: cls,
      _class:    cls,
    });
  }
  // Sort chronologically so waterfall rows flow oldest→newest top→bottom
  // Sort newest→oldest so the most recent reads claim the lowest lane IDs
  // (lanes 0, 1, 2 …). Lane 0 renders at the top of the waterfall, so recent
  // reads are always visible near the top of the default 6-month window even
  // when most other lanes are empty.
  items.sort((a, b) => b.start - a.start);
  // Round-robin across fixed lanes; _group is immutable — filter re-packing
  // only changes 'group', leaving _group intact for the scrubber minimap.
  items.forEach((it, i) => {
    it.group  = i % WATERFALL_ROWS;
    it._group = it.group;   // freeze original assignment for scrubber
  });
  // Restore chronological order (oldest→newest) for display.
  items.sort((a, b) => a.start - b.start);
  return items;
}

// ── Canvas scrubber ───────────────────────────────────────────────────────────

const FILL   = { owned: '#4a88e0', kindle: '#aaaaaa', borrowed: '#44cc77', current: '#ee5555' };
const STROKE = { owned: '#88bbff', kindle: '#cccccc', borrowed: '#88eebb', current: '#ff9999' };

const SCRUB_YEAR_H = 12;  // pixels reserved for year labels at bottom of canvas

function drawScrubber() {
  const canvas = document.getElementById('overview-canvas');
  if (!canvas || !scrubMax) return;
  const ctx  = canvas.getContext('2d');
  const W    = canvas.width;
  const H    = canvas.height;
  const span = scrubMax - scrubMin;
  const contentH = H - SCRUB_YEAR_H;   // area above the year-label strip
  const rowH     = contentH / WATERFALL_ROWS;

  function tx(ms) { return (ms - scrubMin) / span * W; }

  // Background
  ctx.fillStyle = '#162414';
  ctx.fillRect(0, 0, W, H);

  // Subtle row dividers
  ctx.strokeStyle = '#2a4020';
  ctx.lineWidth   = 1;
  for (let r = 1; r < WATERFALL_ROWS; r++) {
    const ry = Math.round(r * rowH);
    ctx.beginPath(); ctx.moveTo(0, ry); ctx.lineTo(W, ry); ctx.stroke();
  }

  // Year tick marks
  ctx.strokeStyle = '#2a3e20';
  ctx.fillStyle   = '#859e6a';
  ctx.font        = '10px -apple-system,sans-serif';
  ctx.lineWidth   = 1;
  const y0 = new Date(scrubMin).getFullYear();
  const y1 = new Date(scrubMax).getFullYear();
  for (let y = y0; y <= y1; y++) {
    const x = Math.round(tx(Date.UTC(y, 0, 1)));
    ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, contentH); ctx.stroke();
    ctx.fillText(String(y), x + 2, H - 3);
  }

  // Book bars — each in its original lane (_group) so filter doesn't scramble the minimap
  for (const it of allItems) {
    const x1   = tx(it.start.getTime());
    const x2   = tx(it.end.getTime());
    const w    = Math.max(2, x2 - x1);
    const rowY = (it._group ?? it.group) * rowH;
    const barH = Math.max(1, rowH - 1);
    ctx.fillStyle = FILL[it._class] || FILL.owned;
    ctx.fillRect(x1, rowY, w, barH);
    if (w > 3) {
      ctx.strokeStyle = STROKE[it._class] || STROKE.owned;
      ctx.strokeRect(x1 + 0.5, rowY + 0.5, w - 1, barH - 1);
    }
  }

  // Viewport indicator — spans full content height
  if (mainTimeline) {
    const win = mainTimeline.getWindow();
    // Clamp to canvas bounds: the window may extend past scrubMin/scrubMax
    // (e.g. winEnd is 1 month in the future but scrubMax is today).
    const vx1 = Math.max(0, tx(win.start.getTime()));
    const vx2 = Math.min(W, tx(win.end.getTime()));
    const vw  = Math.max(4, vx2 - vx1);
    ctx.fillStyle   = 'rgba(120,168,78,0.15)';
    ctx.fillRect(vx1, 0, vw, contentH);
    ctx.strokeStyle = '#78a84e';
    ctx.lineWidth   = 2;
    ctx.strokeRect(vx1 + 1, 1, vw - 2, contentH - 2);
  }
}

function scrubToX(clientX) {
  const canvas = document.getElementById('overview-canvas');
  const rect   = canvas.getBoundingClientRect();
  const pct    = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
  const time   = scrubMin + pct * (scrubMax - scrubMin);
  const win    = mainTimeline.getWindow();
  const half   = (win.end - win.start) / 2;
  mainTimeline.setWindow(
    new Date(time - half),
    new Date(time + half),
    { animation: false }
  );
  drawScrubber();
}

function setupScrubber() {
  const canvas = document.getElementById('overview-canvas');

  // Sync canvas pixel dimensions to its CSS display size
  function resize() {
    canvas.width  = canvas.offsetWidth;
    canvas.height = canvas.offsetHeight;
    drawScrubber();
  }
  new ResizeObserver(resize).observe(canvas);
  resize();

  // Mouse
  let down = false;
  canvas.addEventListener('mousedown', e => { down = true; scrubToX(e.clientX); });
  document.addEventListener('mousemove', e => { if (down) scrubToX(e.clientX); });
  document.addEventListener('mouseup',   () => { down = false; });

  // Touch
  canvas.addEventListener('touchstart', e => {
    scrubToX(e.touches[0].clientX); e.preventDefault();
  }, { passive: false });
  canvas.addEventListener('touchmove', e => {
    scrubToX(e.touches[0].clientX); e.preventDefault();
  }, { passive: false });
}

// ── Filter ────────────────────────────────────────────────────────────────────

function applyFilter(filterVal) {
  if (!dataset) return;
  const filtered = filterVal === 'all'
    ? allItems
    : allItems.filter(it => it._class === filterVal);
  // Re-assign groups round-robin within the filtered set so lanes stay dense
  filtered.forEach((it, i) => { it.group = i % WATERFALL_ROWS; });
  dataset.clear();
  dataset.add(filtered);
  // groupsDataset stays fixed — always WATERFALL_ROWS rows
  if (mainTimeline && filtered.length) mainTimeline.fit();
  drawScrubber();
}

// ── Init ──────────────────────────────────────────────────────────────────────

async function init() {
  try {
    const res = await fetch(`${API_BASE}${API}`);
    if (!res.ok) {
      const body = await res.json().catch(() => ({}));
      throw new Error(`API error ${res.status}: ${body.error ?? ''}`);
    }
    const data = await res.json();
    if (!data.reads) throw new Error('No reading data returned');

    allItems      = buildItems(data.reads);
    dataset       = new vis.DataSet(allItems);
    groupsDataset = new vis.DataSet(
      Array.from({ length: WATERFALL_ROWS }, (_, i) => ({ id: i, content: '' }))
    );

    // ── Scrubber time bounds ──
    scrubMin = Math.min(...allItems.map(it => it.start.getTime()));
    scrubMax = Math.max(...allItems.map(it => it.end.getTime()));

    // ── Main timeline ──
    // Default window: last 6 months → 1 month ahead.
    const winEnd   = new Date(Date.now() + 30  * 24 * 3600 * 1000);
    const winStart = new Date(Date.now() - 180 * 24 * 3600 * 1000);

    const mainOptions = {
      start:       winStart,
      end:         winEnd,
      orientation: { axis: 'top' },
      stack:       false,   // waterfall: no packing within a lane
      selectable:  true,
      moveable:    true,
      zoomable:    true,
      zoomMin: 1000 * 60 * 60 * 24 * 14,        // min zoom: 2 weeks
      zoomMax: 1000 * 60 * 60 * 24 * 365 * 30,  // max zoom: 30 years (full reading history)
      tooltip:  { delay: 99999999 },             // suppress vis-timeline's own tooltip
      margin:   { item: { horizontal: 2, vertical: 1 } },
    };

    document.getElementById('loading').style.display  = 'none';
    document.getElementById('timeline').style.display = 'block';
    document.getElementById('overview-section').style.display = 'block';

    mainTimeline = new vis.Timeline(
      document.getElementById('timeline'),
      dataset,
      groupsDataset,
      mainOptions,
    );

    // Force a redraw after the browser has settled the layout.
    // vis-timeline measures container dimensions at construction; the 100ms
    // delay lets CSS min-height take effect before the first render pass.
    setTimeout(() => {
      mainTimeline.redraw();
      drawScrubber();
    }, 100);

    // Redraw scrubber whenever main window changes
    mainTimeline.on('rangechange',  drawScrubber);
    mainTimeline.on('rangechanged', drawScrubber);

    // ── Label clamping: stop title overflow at the start of the next bar ──────
    // After each render, group visible items by row (same top px = same lane),
    // sort by left px, and set each item's label max-width to the gap before the
    // next bar. Uses requestAnimationFrame so it runs after vis-timeline finishes
    // its own DOM pass.
    let clampRAF = null;

    function clampItemLabels() {
      const fg = document.querySelector('#timeline .vis-foreground');
      if (!fg) return;
      const itemEls = [...fg.querySelectorAll('.vis-item:not(.vis-cluster)')];
      if (!itemEls.length) return;

      // vis-timeline positions items via CSS transforms / parent offsets, so
      // el.style.left is not reliable. Use getBoundingClientRect() for actual
      // screen positions. Group by rounded viewport top — items in the same
      // waterfall lane share the same Y coordinate on screen.
      const byRow = new Map();
      itemEls.forEach(el => {
        const rect   = el.getBoundingClientRect();
        const rowKey = Math.round(rect.top);
        if (!byRow.has(rowKey)) byRow.set(rowKey, []);
        byRow.get(rowKey).push({ el, left: rect.left, width: rect.width });
      });

      byRow.forEach(row => {
        row.sort((a, b) => a.left - b.left);
        row.forEach(({ el, left, width }, i) => {
          const content = el.querySelector('.vis-item-content');
          if (!content) return;
          const next = row[i + 1];
          if (next) {
            // px from this bar's left edge to 3px before the next bar
            content.style.maxWidth = Math.max(width, next.left - left - 3) + 'px';
          } else {
            content.style.maxWidth = '';   // last in lane — no limit
          }
        });
      });
    }

    mainTimeline.on('changed', () => {
      cancelAnimationFrame(clampRAF);
      clampRAF = requestAnimationFrame(clampItemLabels);
    });

    // ── Sticky item popup ─────────────────────────────────────────────────────
    const popup      = document.getElementById('item-popup');
    let hideTimer    = null;

    function showPopup(itemId, mouseEvent) {
      clearTimeout(hideTimer);
      const item = dataset.get(itemId);
      if (!item?._read) return;

      popup.innerHTML = buildPopupHTML(item._read, item._read.book ?? {});

      // Position near the cursor, clamped to viewport
      const PAD   = 14;
      const POP_W = 320;
      const POP_H = 260;  // approximate popup height
      let x = mouseEvent.clientX + PAD;
      let y = mouseEvent.clientY + PAD;
      if (x + POP_W > window.innerWidth  - PAD) x = mouseEvent.clientX - POP_W - PAD;
      if (y + POP_H > window.innerHeight - PAD) y = mouseEvent.clientY - POP_H - PAD;

      popup.style.left    = x + 'px';
      popup.style.top     = y + 'px';
      popup.style.display = 'block';
    }

    function scheduleHide() {
      hideTimer = setTimeout(() => { popup.style.display = 'none'; }, 250);
    }

    mainTimeline.on('itemover', e => showPopup(e.item, e.event));
    mainTimeline.on('itemout',  () => scheduleHide());

    popup.addEventListener('mouseenter', () => clearTimeout(hideTimer));
    popup.addEventListener('mouseleave', () => { popup.style.display = 'none'; });

    setupScrubber();

    document.getElementById('filter-tag').addEventListener('change', e => {
      applyFilter(e.target.value);
    });

  } catch (e) {
    document.getElementById('loading').style.display = 'none';
    document.getElementById('timeline-wrap').innerHTML =
      `<div id="error">Failed to load books: ${e.message}</div>`;
    console.error(e);
  }
}

init();
</script>
</body>
</html>
